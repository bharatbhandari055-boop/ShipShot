<script>
const API = ""; // same origin
const PERSONAS = ["Scanner","Team Leader","Hub Manager and above","City Lead","Regional Manager"];
// Keep in sync with MAX_UPLOAD_MB in server.js — only used here for the
// helper text/warnings on the upload form, the server enforces the real limit.
const MAX_UPLOAD_MB = 400;
// MM:SS <-> minutes helpers for the "required watch time" field. Storage
// stays as decimal minutes (content.required_minutes) — only the admin
// input/display is MM:SS.
function mmssToSeconds(str){
  const m = /^(\d{1,2}):([0-5]\d)$/.exec(String(str||"").trim());
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function minutesToMmss(mins){
  const totalSecs = Math.round(Number(mins||0)*60);
  const mm = Math.floor(totalSecs/60), ss = totalSecs%60;
  return String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
// Accepts a full YouTube URL (watch/youtu.be/embed/shorts) or a bare video ID.
function extractYoutubeId(url){
  url = String(url||"").trim();
  let m = /[?&]v=([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  m = /youtu\.be\/([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  m = /youtube\.com\/(?:embed|shorts)\/([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{6,}$/.test(url)) return url;
  return null;
}
const slug = p => p.replace(/[^a-zA-Z0-9]/g,"_");
const app = document.getElementById("app");
const crumbSub = document.getElementById("crumbSub");
const logoutBtn = document.getElementById("logoutBtn");
const exportCsvBtn = document.getElementById("exportCsvBtn");

let adminSession = null; // {token, username}
try{ const saved = sessionStorage.getItem("adminSession"); if(saved) adminSession = JSON.parse(saved); }catch(e){}
let state = { view:"loading", persona:PERSONAS[0] };

function showToast(msg, ms){
  let t = document.getElementById("toastEl");
  if(!t){ t=document.createElement("div"); t.id="toastEl"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.display="none"; }, ms||4500);
}

// ---- Ported from index.html: dynamic custom-field rendering + the
// "search by name" tagging typeahead, both needed by the new "Add User
// Directly" form in the Access tab below. ----
let formFieldsCache = null;
async function loadFormFields(){
  if(!formFieldsCache){ try{ formFieldsCache = await api("/api/form-fields"); }catch(e){ formFieldsCache = []; } }
  return formFieldsCache;
}
async function renderCustomFieldsInto(containerId, existingValues){
  const container = document.getElementById(containerId);
  if(!container) return;
  const fields = await loadFormFields();
  const vals = existingValues || {};
  container.innerHTML = fields.map(f=>{
    const val = vals[f.fieldKey] || "";
    const reqStar = f.required ? " *" : "";
    if(f.type==="dropdown"){
      return `<label>${escapeHtml(f.label)}${reqStar}</label><select class="field" data-custom-field="${escapeAttr(f.fieldKey)}">
        <option value=""></option>
        ${f.options.map(o=>`<option value="${escapeAttr(o)}" ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("")}
      </select>`;
    }
    const inputType = f.type==="number" ? "number" : f.type==="date" ? "date" : "text";
    return `<label>${escapeHtml(f.label)}${reqStar}</label><input class="field" type="${inputType}" data-custom-field="${escapeAttr(f.fieldKey)}" value="${escapeAttr(val)}">`;
  }).join("");
}
function collectCustomFieldValues(containerId){
  const container = document.getElementById(containerId);
  if(!container) return {};
  const out = {};
  container.querySelectorAll("[data-custom-field]").forEach(el=>{ out[el.dataset.customField] = el.value.trim(); });
  return out;
}
function validateRequiredCustomFields(containerId, msgEl){
  const container = document.getElementById(containerId);
  if(!container) return true;
  let ok = true;
  container.querySelectorAll("[data-custom-field]").forEach(el=>{
    const label = el.previousElementSibling ? el.previousElementSibling.textContent : el.dataset.customField;
    if(label.trim().endsWith("*") && !el.value.trim()) ok = false;
  });
  if(!ok) msgEl.innerHTML = `<div class="msg msg-danger">Please fill in all required fields.</div>`;
  return ok;
}
function wireUserTypeahead({inputEl, hiddenIdEl, listEl, fetchCandidates}){
  let debounceTimer;
  inputEl.addEventListener("input", ()=>{
    hiddenIdEl.value = "";
    clearTimeout(debounceTimer);
    const q = inputEl.value.trim();
    debounceTimer = setTimeout(async ()=>{
      if(q.length<1){ listEl.innerHTML=""; listEl.classList.add("hidden"); return; }
      const candidates = await fetchCandidates(q);
      if(candidates.length===0){ listEl.innerHTML = `<div style="padding:6px;color:var(--muted);font-size:12px">No matching names.</div>`; listEl.classList.remove("hidden"); return; }
      listEl.innerHTML = candidates.map(c=>`<div class="typeahead-row" data-id="${escapeAttr(c.id)}" style="padding:6px;cursor:pointer;border-bottom:1px solid var(--border)"><b>${escapeHtml(c.name)}</b> <span style="color:var(--muted);font-size:12px">${escapeHtml(c.primaryRole||c.primary_role||"")} · ${escapeHtml(c.hub||"")}</span></div>`).join("");
      listEl.classList.remove("hidden");
      listEl.querySelectorAll("[data-id]").forEach(row=>{
        row.onclick = ()=>{
          hiddenIdEl.value = row.dataset.id;
          inputEl.value = row.querySelector("b").textContent;
          listEl.innerHTML=""; listEl.classList.add("hidden");
        };
      });
    }, 200);
  });
  inputEl.addEventListener("blur", ()=> setTimeout(()=>listEl.classList.add("hidden"), 150));
}

function armConfirm(btn, onConfirm){
  if(btn.dataset.armed==="1"){
    btn.dataset.armed="0";
    onConfirm();
  } else {
    const original = btn.textContent;
    btn.dataset.armed="1";
    btn.textContent = "Tap again to confirm";
    setTimeout(()=>{ if(btn.dataset.armed==="1"){ btn.dataset.armed="0"; btn.textContent=original; } }, 4000);
  }
}

// Generic API helper. Adds the admin bearer token once logged in; a 401
// means the session expired, so it drops back to the login screen.
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(adminSession && adminSession.token) headers["Authorization"] = "Bearer "+adminSession.token;
  const res = await fetch(API+path, Object.assign({}, opts, {headers}));
  if(res.status===401 && state.view==="admin"){
    adminSession=null; sessionStorage.removeItem("adminSession");
    state={view:"login"}; render();
    throw new Error("session_expired");
  }
  let data=null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.error)||"request_failed"); err.status=res.status; err.data=data; throw err; }
  return data;
}
async function apiUpload(path, formData){
  const headers = {};
  if(adminSession && adminSession.token) headers["Authorization"] = "Bearer "+adminSession.token;
  const res = await fetch(API+path, {method:"POST", headers, body: formData});
  let data=null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.error)||"upload_failed"); err.status=res.status; err.data=data; throw err; }
  return data;
}

async function init(){
  logoutBtn.onclick = ()=>{ adminSession=null; sessionStorage.removeItem("adminSession"); goHome(); };
  exportCsvBtn.onclick = async ()=>{
    try{
      const res = await fetch(API+"/api/admin/export-csv", { headers: { "Authorization": "Bearer "+adminSession.token } });
      if(!res.ok) throw new Error("failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "lastmile_ready_users.csv";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ showToast("CSV export failed."); }
  };
  goHome();
}

async function goHome(){
  if(!adminSession){
    state = {view:"checkingSetup"};
    render();
    try{
      const j = await api("/api/admin/has-admin");
      state = { view: j.hasAdmin ? "login" : "setup" };
    }catch(e){ state = {view:"login"}; }
    return render();
  }
  logoutBtn.classList.remove("hidden");
  exportCsvBtn.classList.remove("hidden");
  state = { view:"admin", persona: state.persona || PERSONAS[0] };
  render();
}

function render(){
  logoutBtn.classList.toggle("hidden", !adminSession);
  exportCsvBtn.classList.toggle("hidden", !adminSession);
  if(state.view==="loading" || state.view==="checkingSetup"){ crumbSub.textContent="Loading…"; app.innerHTML="Loading…"; return; }
  if(state.view==="setup") return renderSetup();
  if(state.view==="login") return renderAdminLogin();
  if(state.view==="adminChangePassword") return renderAdminChangePassword();
  if(state.view==="admin") return renderAdmin();
}

// ---------------- ADMIN LOGIN ----------------
function renderSetup(){
  crumbSub.textContent = "First-time admin setup";
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">Create the first admin account</div>
    <p style="font-size:12px;color:var(--muted)">No admin account exists yet for this dashboard. Create one now — you can add more admins later from inside the panel.</p>
    <label>Admin username</label><input class="field" id="sUser" autocomplete="username">
    <label>Password</label><input class="field" id="sPass" type="password" autocomplete="new-password">
    <label>Confirm password</label><input class="field" id="sPass2" type="password" autocomplete="new-password">
    <button class="btn btn-primary" id="sSubmit" style="width:100%;margin-top:8px">Create admin account & log in</button>
    <div id="sMsg"></div>
  </div>`;
  document.getElementById("sSubmit").onclick = async ()=>{
    const uname = document.getElementById("sUser").value.trim().toLowerCase();
    const pass = document.getElementById("sPass").value;
    const pass2 = document.getElementById("sPass2").value;
    const msg = document.getElementById("sMsg");
    if(!uname || pass.length<6){ msg.innerHTML=`<div class="msg msg-danger">Username required; password must be at least 6 characters.</div>`; return; }
    if(pass!==pass2){ msg.innerHTML=`<div class="msg msg-danger">Passwords don't match.</div>`; return; }
    try{
      const result = await api("/api/admin/setup", {method:"POST", body: JSON.stringify({username:uname, password:pass})});
      adminSession = {token: result.token, username: result.username};
      sessionStorage.setItem("adminSession", JSON.stringify(adminSession));
      goHome();
    }catch(e){ msg.innerHTML=`<div class="msg msg-danger">Could not create admin account. Please try again.</div>`; }
  };
}

function renderAdminLogin(){
  crumbSub.textContent = "Admin login";
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">🔑 Admin login</div>
    <label>Username</label><input class="field" id="aUser" autocomplete="username">
    <label>Password</label><input class="field" id="aPass" type="password" autocomplete="current-password">
    <button class="btn btn-primary" id="aSubmit" style="width:100%;margin-top:8px">Log in</button>
    <div id="aMsg"></div>
  </div>`;
  document.getElementById("aSubmit").onclick = async ()=>{
    const uname = document.getElementById("aUser").value.trim().toLowerCase();
    const pass = document.getElementById("aPass").value;
    const msg = document.getElementById("aMsg");
    if(!uname || !pass){ msg.innerHTML=`<div class="msg msg-danger">Enter your username and password.</div>`; return; }
    try{
      const result = await api("/api/admin/login", {method:"POST", body: JSON.stringify({username:uname, password:pass})});
      adminSession = {token: result.token, username: result.username, tier: result.tier};
      sessionStorage.setItem("adminSession", JSON.stringify(adminSession));
      if(result.mustChangePassword){ state = {view:"adminChangePassword"}; render(); return; }
      goHome();
    }catch(e){ msg.innerHTML=`<div class="msg msg-danger">Incorrect username or password.</div>`; }
  };
}

// Forced first-login change for the seeded Superadmin/1111 bootstrap
// account — also collects their real name at the same time.
function renderAdminChangePassword(){
  crumbSub.textContent = "Set your password";
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">🔒 Welcome, Super Admin</div>
    <p style="font-size:12px;color:var(--muted)">This is the first login on the bootstrap account. Set your real name and a new password before continuing.</p>
    <label>Your Name</label><input class="field" id="apName">
    <label>New Password (min 6 characters)</label><input class="field" id="apPass1" type="password">
    <label>Confirm Password</label><input class="field" id="apPass2" type="password">
    <button class="btn btn-primary" id="apSubmit" style="width:100%;margin-top:8px">Save & Continue</button>
    <div id="apMsg"></div>
  </div>`;
  document.getElementById("apSubmit").onclick = async ()=>{
    const name = document.getElementById("apName").value.trim();
    const p1 = document.getElementById("apPass1").value;
    const p2 = document.getElementById("apPass2").value;
    const msg = document.getElementById("apMsg");
    if(p1.length<6){ msg.innerHTML=`<div class="msg msg-danger">Password must be at least 6 characters.</div>`; return; }
    if(p1!==p2){ msg.innerHTML=`<div class="msg msg-danger">Passwords don't match.</div>`; return; }
    try{
      await api("/api/admin/change-password", {method:"POST", body: JSON.stringify({newPassword:p1, name})});
      showToast("Password updated.");
      goHome();
    }catch(e){ msg.innerHTML=`<div class="msg msg-danger">Could not save. Please try again.</div>`; }
  };
}

// ---------------- ADMIN PANEL: 5 tabs ----------------
async function renderAdmin(){
  crumbSub.textContent = "Logged in as "+(adminSession.username||"admin");
  if(!PERSONAS.includes(state.persona)) state.persona = PERSONAS[0];
  if(!state.adminTab) state.adminTab = "training";

  app.innerHTML = `<div class="grid" id="mainTabs" style="margin-bottom:14px"></div><div id="mainTabBody"></div>`;
  const tabs = [
    ["training","🎓 Add Training Content"],
    ["assign","📌 Assign Task"],
    ["tagging","🏷️ Tagging"],
    ["registration","📝 Registration"],
    ["access","🔐 Access"]
  ];
  const tabsEl = document.getElementById("mainTabs");
  tabs.forEach(([key,label])=>{
    const b = document.createElement("button");
    b.className = "btn"+(state.adminTab===key?" btn-primary":"");
    b.textContent = label;
    b.onclick = ()=>{ state.adminTab=key; renderAdmin(); };
    tabsEl.appendChild(b);
  });

  const body = document.getElementById("mainTabBody");
  if(state.adminTab==="training") renderAddTrainingTab(body);
  else if(state.adminTab==="assign") renderAssignTaskTab(body);
  else if(state.adminTab==="tagging") renderTaggingTab(body);
  else if(state.adminTab==="registration") renderRegistrationTab(body);
  else if(state.adminTab==="access") renderAccessTab(body);
}

// ---------------- TAB: Add Training Content ----------------

  const tabs = document.getElementById("adminTabs");
  PERSONAS.forEach(p=>{
    const b = document.createElement("button");
    b.className="btn"+(p===state.persona?" btn-primary":"");
    b.textContent = p;
    b.onclick = ()=>{ state.persona=p; state.topic=null; renderAdmin(); };
    tabs.appendChild(b);
  });
  const bodyEl = document.getElementById("adminBody");
  bodyEl.innerHTML = `<div class="section-title">Content for ${state.persona}</div>
  <p style="color:var(--muted);font-size:12px;margin-top:-4px">Give each piece of content a Topic/Module — items sharing a topic are grouped for staff and share one assessment below.</p>
  <div id="adminContentList">Loading…</div>

  <div class="top-actions" id="topicTabs" style="margin-bottom:8px"></div>

// ---------------- TAB: Assign Task ----------------
async function renderAssignTaskTab(body){
  body.innerHTML = `<div class="section-title" style="margin-top:0">Users</div>
  <div id="userRatioCard" class="content-card">Loading…</div>
  <div class="section-title">Completion overview</div>
  <div id="statsPanel"></div>
  <div class="section-title">Currently Assigned Users</div>
  <div id="adminAllUsers">Loading…</div>
  <div class="section-title">Assign Content to Users</div>
  <div id="assignPanel">Loading…</div>`;
  loadUserRatio();
  renderStatsPanel();
  loadAllUsers();
  renderAssignPanel();
}
async function loadUserRatio(){
  const el = document.getElementById("userRatioCard");
  try{
    const rows = await api("/api/admin/users");
    const total = rows.length;
    const now = Date.now();
    const active = rows.filter(({data:p})=> p.lastLogin && (now-p.lastLogin) <= (1000*60*60*24*30*6)).length;
    const inactive = total - active;
    const pct = n => total>0 ? Math.round((n/total)*100) : 0;

async function renderTaggingGraphPanel(){
  const el = document.getElementById("taggingGraphPanel");
  el.innerHTML = `<div class="content-card">

    <select class="field" id="tagGraphType" style="max-width:160px">

    <canvas id="tagGraphCanvas" height="100"></canvas>
  </div>`;

async function drawTaggingGraph(){
  const canvasWrap = document.getElementById("tagGraphCanvas")?.parentElement;
  if(typeof Chart === "undefined"){
    if(canvasWrap) canvasWrap.innerHTML += `<div class="msg msg-danger">Chart.js didn't load — the graph can't render without it.</div>`;
    return;
  }
  let data;
  try{ data = await api("/api/admin/stats/tagging"); }
  catch(e){ if(canvasWrap) canvasWrap.innerHTML += `<div class="msg msg-danger">Could not load tagging stats.</div>`; return; }
  const type = document.getElementById("tagGraphType").value;
  const ctx = document.getElementById("tagGraphCanvas").getContext("2d");
  if(taggingGraphChart) taggingGraphChart.destroy();
  const higherPersonas = PERSONAS.filter(p=>p!=="Scanner"); // nothing is ever tagged to a Scanner
  const subPersonas = PERSONAS.filter(p=>p!=="Regional Manager"); // RM never reports to anyone, so never appears as a subordinate
  const colors = ["#1f8a4c","#2f6fed","#a86a00","#c0392b","#7a4fd1"];
  try{
    if(type==="donut"){
      const totals = subPersonas.map(sp => higherPersonas.reduce((sum,hp)=> sum + ((data[hp]||{})[sp]||0), 0));
      taggingGraphChart = new Chart(ctx, { type:"doughnut", data:{ labels: subPersonas, datasets:[{ data: totals, backgroundColor: colors }] } });
    } else {
      taggingGraphChart = new Chart(ctx, {
        type:"bar",
        data:{ labels: higherPersonas, datasets: subPersonas.map((sp,i)=>({ label: sp, data: higherPersonas.map(hp=>(data[hp]||{})[sp]||0), backgroundColor: colors[i%colors.length] })) },
        options:{ responsive:true, scales:{ x:{stacked:true}, y:{stacked:true} } }
      });
    }
  }catch(e){ console.error("Tagging chart render failed:", e); if(canvasWrap) canvasWrap.innerHTML += `<div class="msg msg-danger">Chart failed to render.</div>`; }
}

function roleCheckboxesHtml(idPrefix, selectedArr){
  const sel = selectedArr || [];
  let out = `<div style="display:flex;flex-wrap:wrap;gap:10px;margin:6px 0">`;
  PERSONAS.forEach(p=>{
    const cid = idPrefix+"__"+slug(p);
    out += `<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text)">
      <input type="checkbox" id="${cid}" data-role="${p}" ${sel.includes(p)?"checked":""}> ${p}</label>`;
  });
  out += `</div>`;
  return out;
}
function getCheckedRoles(scopeEl, idPrefix){
  const roles = [];
  scopeEl.querySelectorAll(`input[type=checkbox][id^="${idPrefix}__"]`).forEach(cb=>{ if(cb.checked) roles.push(cb.dataset.role); });
  return roles;
}

let statsChart = null, statsPersonaChart = null;
async function renderStatsPanel(){
  const el = document.getElementById("statsPanel");

          <option value="stacked">Stacked bar</option>

        </select>
      </div>

  }catch(e){}

  document.getElementById("statsCity").onchange = loadAndDrawStats;

let adminHubMappingCache = null;
async function loadAdminHubMapping(){
  if(!adminHubMappingCache) adminHubMappingCache = await api("/api/hub-mapping");
  return adminHubMappingCache;
}
async function loadAndDrawStats(){
  const city = document.getElementById("statsCity").value;
  const metric = document.getElementById("statsMetric").value;
  const type = document.getElementById("statsChartType").value;
  const canvas = document.getElementById("statsCanvas");
  const breakdownEl = document.getElementById("personaBreakdown");
  if(typeof Chart === "undefined"){
    breakdownEl.innerHTML = `<div class="msg msg-danger">Chart.js didn't load (likely blocked by a network/firewall rule on cdnjs.cloudflare.com) — the graph can't render without it.</div>`;
    return;
  }
  let data;
  try{ data = await api("/api/admin/stats/summary"+(city?"?city="+encodeURIComponent(city):"")); }
  catch(e){ breakdownEl.innerHTML = `<div class="msg msg-danger">Could not load stats from the server (${escapeHtml(e.message||"request failed")}).</div>`; return; }
  const hubs = data.hubs || [];
  const labels = hubs.map(h=>h.hub);
  if(labels.length===0){
    if(statsChart){ statsChart.destroy(); statsChart=null; }
    breakdownEl.innerHTML = `<div class="empty">No users to show yet.</div>`;
    return;
  }
  const colors = ["#1f8a4c","#a86a00","#c0392b"];
  const series = metric==="activity"
    ? [{label:"Active", data:hubs.map(h=>h.active), color:colors[0]}, {label:"Inactive", data:hubs.map(h=>h.inactive), color:colors[2]}]
    : [{label:"Completed", data:hubs.map(h=>h.completed), color:colors[0]}, {label:"Ongoing", data:hubs.map(h=>h.ongoing), color:colors[1]}, {label:"Pending", data:hubs.map(h=>h.pending), color:colors[2]}];

  try{
    const ctx = canvas.getContext("2d");
    if(statsChart) statsChart.destroy();
    if(type==="donut"){
      const totals = series.map(s=>s.data.reduce((a,b)=>a+b,0));
      statsChart = new Chart(ctx, { type:"doughnut", data:{ labels: series.map(s=>s.label), datasets:[{ data: totals, backgroundColor: series.map(s=>s.color) }] } });
    } else {
      statsChart = new Chart(ctx, {
        type:"bar",
        data:{ labels, datasets: series.map(s=>({ label:s.label, data:s.data, backgroundColor:s.color })) },
        options: { responsive:true, scales: type==="stacked" ? { x:{stacked:true}, y:{stacked:true} } : {}, onClick: (evt, els)=>{ if(els.length && metric==="completion"){ const hub = labels[els[0].index]; state.statsHub = hub; loadPersonaBreakdown(hub); } } }
      });
    }
  }catch(e){
    console.error("Chart render failed:", e);
    breakdownEl.innerHTML = `<div class="msg msg-danger">Chart failed to render (${escapeHtml(e.message||"unknown error")}) — check the browser console for details.</div>`;
    return;
  }
  breakdownEl.innerHTML = metric==="completion" ? `<p style="font-size:11px;color:var(--muted)">Click a hub's bar above to see the persona-wise breakdown for that hub.</p>` : "";
  if(metric==="completion" && state.statsHub && labels.includes(state.statsHub)) loadPersonaBreakdown(state.statsHub);
}
async function loadPersonaBreakdown(hub){
  const el = document.getElementById("personaBreakdown");
  el.innerHTML = `<div class="empty">Loading ${escapeHtml(hub)}…</div>`;
  let data;
  try{ data = await api("/api/admin/stats/summary?hub="+encodeURIComponent(hub)); }
  catch(e){ el.innerHTML = `<div class="empty">Could not load breakdown.</div>`; return; }
  const personas = data.personas || [];
  if(personas.length===0){ el.innerHTML = `<div class="empty">No data for ${escapeHtml(hub)} yet.</div>`; return; }
  el.innerHTML = `<div class="section-title" style="margin-top:0">Persona breakdown — ${escapeHtml(hub)}</div><canvas id="personaCanvas" height="110"></canvas>`;
  const ctx = document.getElementById("personaCanvas").getContext("2d");
  if(statsPersonaChart) statsPersonaChart.destroy();
  statsPersonaChart = new Chart(ctx, {
    type:"bar",
    data:{ labels: personas.map(p=>p.persona), datasets:[
      { label:"Completed", data: personas.map(p=>p.completed), backgroundColor:"#1f8a4c" },
      { label:"Ongoing", data: personas.map(p=>p.ongoing), backgroundColor:"#a86a00" },
      { label:"Pending", data: personas.map(p=>p.pending), backgroundColor:"#c0392b" }
    ]},
    options: { responsive:true, scales:{ x:{stacked:true}, y:{stacked:true} } }
  });
}

function renderAsgUserList(filterText){
  const listEl = document.getElementById("asgUserList");
  if(!listEl) return;
  const q = (filterText||"").trim().toLowerCase();
  const filtered = cachedAsgUsers.filter(({data:p})=> !q || (p.name||"").toLowerCase().includes(q) || (p.phone||"").toLowerCase().includes(q));
  lastAsgFilteredIds = filtered.map(({id})=>id);
  const selAll = document.getElementById("asgSelectAll");
  if(selAll) selAll.checked = lastAsgFilteredIds.length>0 && lastAsgFilteredIds.every(id=>assignSelectedUsers.has(id));
  if(filtered.length===0){ listEl.innerHTML = `<div class="empty">No matching users.</div>`; return; }
  listEl.innerHTML = "";
  filtered.forEach(({id,data:p})=>{
    const row = document.createElement("label");
    row.style.cssText = "display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0";
    row.innerHTML = `<input type="checkbox" ${assignSelectedUsers.has(id)?"checked":""}> <b>${escapeHtml(p.name)}</b> <span style="color:var(--muted)">${escapeHtml(p.phone)} · ${escapeHtml((p.roles||[]).join(", "))}</span>`;

    listEl.appendChild(row);
  });
}

async function loadAdminContent(){

  // first used) and keep "General" always available as a fallback.
  const seen = [];
  rows.forEach(({data:c})=>{ const t=(c.topic&&c.topic.trim())||"General"; if(!seen.includes(t)) seen.push(t); });
  if(!seen.includes("General")) seen.push("General");
  adminTopics = seen;
  if(!state.topic || !adminTopics.includes(state.topic)) state.topic = adminTopics[0];
  renderTopicTabs();
  loadAdminQuestions();
  loadAdminSubs();

  if(rows.length===0){ el.innerHTML=`<div class="empty">No content yet.</div>`; return; }

  const groups = new Map();
  rows.forEach(item=>{ const t=(item.data.topic&&item.data.topic.trim())||"General"; if(!groups.has(t)) groups.set(t,[]); groups.get(t).push(item); });
  el.innerHTML = "";
  groups.forEach((items, topic)=>{
    const h = document.createElement("div");
    h.style.cssText = "font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 4px";
    h.textContent = "📘 "+topic;
    el.appendChild(h);
    items.forEach(({id,data:c})=>{
      const row = document.createElement("div");
      row.className="content-card";
      row.innerHTML = `<div class="row"><div><span class="tag">${(c.type||"link").toUpperCase()}</span>
      <h3 style="margin:4px 0">${escapeHtml(c.title)}</h3></div>
      <div class="top-actions">
        <button class="btn btn-sm" data-e>Edit</button>
        <button class="btn btn-sm btn-danger" data-d>Delete</button>
      </div></div>`;
      row.querySelector("[data-e]").onclick = ()=>openContentForm({id, data:()=>c});
      row.querySelector("[data-d]").onclick = (e)=> armConfirm(e.target, async ()=>{
        try{ await api("/api/admin/content/"+id, {method:"DELETE"}); showToast("Deleted."); loadAdminContent(); }
        catch(err){ showToast("Delete failed — admin access required."); }
      });
      el.appendChild(row);
    });
  });
}

function openContentForm(doc){
  const c = doc ? doc.data() : {type:"ppt",title:"",description:"",url:"",topic: (state.topic && state.topic!=="General") ? state.topic : ""};
  const wrap = document.createElement("div");
  wrap.className="content-card";
  wrap.innerHTML = `
  <label>Type</label>
  <select class="field" id="cType">
    <option value="ppt">PPT / Presentation</option>
    <option value="video">Video (uploaded file / direct URL)</option>
    <option value="youtube">YouTube Video (unlisted link)</option>
    <option value="doc">Document</option>
    <option value="image">Image / Poster</option>
    <option value="link">Link</option>
  </select>
  <label>Topic / Module</label>
  <input class="field" id="cTopic" list="topicSuggestions" placeholder="e.g. Module 1: Safety Basics (leave blank for General)" value="${escapeAttr(c.topic||"")}">
  <datalist id="topicSuggestions">${adminTopics.map(t=>`<option value="${escapeAttr(t)}">`).join("")}</datalist>
  <p style="font-size:11px;color:var(--muted);margin:-2px 0 6px">Content sharing a topic is grouped together for staff and unlocks one shared assessment once all of it is completed.</p>
  <label>Title</label><input class="field" id="cTitle" value="${escapeAttr(c.title)}">
  <label>Description</label><input class="field" id="cDesc" value="${escapeAttr(c.description)}">
  <label id="cUrlLabel">URL (external link, or leave blank and upload a file below)</label>
  <input class="field" id="cUrl" value="${escapeAttr(c.url||"")}" placeholder="">
  <div id="cFileWrap">
    <label>Or upload a file (video/PDF/PPT/image — up to ${MAX_UPLOAD_MB}MB)</label>
    <input class="field" type="file" id="cFile">
    <div id="cFileInfo" style="font-size:11px;color:var(--muted);margin-top:-4px"></div>
  </div>
  <div id="cDurationWrap" class="hidden">
    <label>Required watch time before staff can mark this video complete (MM:SS) *</label>
    <p style="font-size:11px;color:var(--muted);margin:2px 0 6px">Type it as minutes:seconds — e.g. a 24-second video is <code>00:24</code>, five and a half minutes is <code>05:30</code>. Max 15:00.</p>
    <input class="field" id="cDuration" type="text" placeholder="MM:SS" maxlength="5" value="${c.requiredMinutes?minutesToMmss(c.requiredMinutes):""}">
    <p style="font-size:11px;color:var(--muted)">Staff must accumulate this much actual playing time — pauses and seek-ahead don't count toward it — before "Mark as completed" becomes clickable for them. This is tracked for real on YouTube videos too, not just uploaded ones.</p>
  </div>
  <p style="font-size:11px;color:var(--muted)">Staff view everything on the dashboard itself — pick a URL/file that's viewable without a login wall so the in-page preview works.</p>
  <div class="top-actions">
    <button class="btn btn-primary btn-sm" id="cSave">Save</button>
    <button class="btn btn-sm" id="cCancel">Cancel</button>
  </div>`;
  document.getElementById("adminContentList").prepend(wrap);
  const typeSel = wrap.querySelector("#cType");
  const durWrap = wrap.querySelector("#cDurationWrap");
  const fileWrap = wrap.querySelector("#cFileWrap");
  const urlLabel = wrap.querySelector("#cUrlLabel");
  const urlInput = wrap.querySelector("#cUrl");
  typeSel.value = c.type;
  const syncVisibility = ()=>{
    const t = typeSel.value;
    durWrap.classList.toggle("hidden", t!=="video" && t!=="youtube");
    fileWrap.classList.toggle("hidden", t==="youtube"); // YouTube is paste-only, no file upload
    if(t==="youtube"){
      urlLabel.textContent = "YouTube URL *";
      urlInput.placeholder = "e.g. https://youtu.be/XXXXXXXXXXX or https://www.youtube.com/watch?v=XXXXXXXXXXX";
    } else {
      urlLabel.textContent = "URL (external link, or leave blank and upload a file below)";
      urlInput.placeholder = "";
    }
  };
  typeSel.onchange = syncVisibility;
  syncVisibility();
  const fileInput = wrap.querySelector("#cFile");
  const fileInfo = wrap.querySelector("#cFileInfo");
  fileInput.onchange = ()=>{
    const f = fileInput.files[0];
    if(!f){ fileInfo.textContent=""; return; }
    const mb = (f.size/(1024*1024));
    let msg = `Selected file: ${mb.toFixed(1)}MB`;
    if(mb>50){
      msg += ` — bigger than 50MB. If your Supabase project is still on the Free plan, uploads over 50MB will fail no matter what (Free plan hard-caps the "Global file size limit" in Storage Settings at 50MB). Upgrade to Supabase Pro and raise that setting to allow this, or use a YouTube (unlisted) link instead.`;
    }
    fileInfo.textContent = msg;
    fileInfo.style.color = mb>50 ? "#f0ad4e" : "var(--muted)";
  };
  wrap.querySelector("#cCancel").onclick = ()=>wrap.remove();
  wrap.querySelector("#cSave").onclick = async ()=>{
    let url = wrap.querySelector("#cUrl").value.trim();
    const file = wrap.querySelector("#cFile").files[0];
    const type = typeSel.value;
    let requiredMinutes = null;
    if(type==="youtube"){
      if(!extractYoutubeId(url)){ showToast("Enter a valid YouTube URL (or just the video ID)."); return; }
    }
    if(type==="video" || type==="youtube"){
      const raw = wrap.querySelector("#cDuration").value.trim();
      const secs = mmssToSeconds(raw);
      if(secs===null || secs<=0){ showToast("Enter the required watch time as MM:SS (e.g. 05:30)."); return; }
      if(secs>900){ showToast("Required watch time can't be more than 15:00."); return; }
      requiredMinutes = secs/60;
    }
    if(file && type!=="youtube"){
      try{
        const fd = new FormData(); fd.append("file", file);
        const res = await apiUpload("/api/admin/upload", fd);
        url = res.url;
      }
      catch(e){
        if(e && e.data && e.data.error==="file_too_large") showToast(`That file is over the ${e.data.maxMb}MB server limit.`);
        else if(e && e.data && e.data.error==="file_too_large_for_bucket") showToast("Upload rejected by Supabase Storage — the project's file size limit (Storage → Settings) is lower than this file. On the Free plan that's capped at 50MB.");
        else showToast("Upload failed.");
        return;
      }
    }
    const data = {
      persona: state.persona,
      type,
      topic: wrap.querySelector("#cTopic").value.trim() || "General",
      title: wrap.querySelector("#cTitle").value.trim()||"Untitled",
      description: wrap.querySelector("#cDesc").value.trim(),
      url,
      requiredMinutes,
      createdAt: (doc && c.createdAt) || Date.now()
    };
    try{
      if(doc) await api("/api/admin/content/"+doc.id, {method:"PUT", body: JSON.stringify(data)});
      else await api("/api/admin/content", {method:"POST", body: JSON.stringify(data)});
      wrap.remove(); loadAdminContent();
    }catch(e){ showToast("Save failed — admin access required."); }
  };
}

async function loadAdminQuestions(){
  const el = document.getElementById("adminQList");
  if(!el) return;
  el.innerHTML = "Loading…";
  let qs, passScore;
  try{ const j = await api("/api/admin/questions?persona="+encodeURIComponent(state.persona)+"&topic="+encodeURIComponent(state.topic)); qs = j.questions; passScore = j.passScore; }
  catch(e){ el.innerHTML=`<div class="empty">Could not load questions.</div>`; return; }
  const psInput = document.getElementById("passScoreInput");
  if(psInput) psInput.value = passScore != null ? passScore : 80;
  if(qs.length===0){ el.innerHTML=`<div class="empty">No questions yet for "${escapeHtml(state.topic)}".</div>`; return; }
  el.innerHTML="";
  qs.forEach((q,i)=>{
    const row = document.createElement("div");
    row.className="content-card row";
    const isMcq = q.type==="mcq" && Array.isArray(q.options);
    row.innerHTML = `<div style="flex:1;min-width:200px">
      <div>${i+1}. ${escapeHtml(q.text)} ${isMcq?'<span class="pill">multiple choice</span>':'<span class="pill">free text</span>'}</div>
      ${isMcq ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">${q.options.map(o=> o===q.correctAnswer ? `<span class="tag" style="background:#e6f6ec;color:var(--ok)">✅ ${escapeHtml(o)}</span>` : `<span class="tag">${escapeHtml(o)}</span>`).join("")}</div>` : ""}
    </div>
    <button class="btn btn-sm btn-danger">Remove</button>`;
    row.querySelector("button").onclick = async ()=>{
      try{ await api("/api/admin/questions/"+q.id+"?persona="+encodeURIComponent(state.persona)+"&topic="+encodeURIComponent(state.topic), {method:"DELETE"}); loadAdminQuestions(); }
      catch(e){ showToast("Remove failed."); }
    };
    el.appendChild(row);
  });
}

function openQuestionForm(){
  const el = document.getElementById("adminQList");
  if(document.getElementById("qFormBox")) return;
  const wrap = document.createElement("div");
  wrap.className="content-card";
  wrap.id="qFormBox";
  wrap.innerHTML = `<label>New question for "${escapeHtml(state.topic)}"</label>
  <input class="field" id="qText" placeholder="Enter the question text">
  <label>Answer type</label>
  <select class="field" id="qType">
    <option value="text">Free text (staff type their own answer)</option>
    <option value="mcq">Multiple choice (staff pick one option)</option>
  </select>
  <div id="qOptionsWrap" class="hidden">
    <label>Options (at least 2) — mark the radio next to the correct one</label>
    <div id="qOptionsList"></div>
    <button class="btn btn-sm" id="qAddOption" type="button">＋ Add option</button>
  </div>
  <div class="top-actions" style="margin-top:10px">
    <button class="btn btn-primary btn-sm" id="qSave">Add</button>
    <button class="btn btn-sm" id="qCancel">Cancel</button>
  </div>`;
  el.prepend(wrap);
  const typeSel = wrap.querySelector("#qType");
  const optsWrap = wrap.querySelector("#qOptionsWrap");
  const optsList = wrap.querySelector("#qOptionsList");
  function addOptionInput(val, isCorrect){
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;align-items:center";
    row.innerHTML = `<input type="radio" name="qCorrectOpt" data-correct title="Mark as the correct answer" ${isCorrect?"checked":""}>
      <input class="field" data-opt style="margin:4px 0" value="${escapeAttr(val||"")}">
      <button class="btn btn-sm" type="button" data-remove>✕</button>`;
    row.querySelector("[data-remove]").onclick = ()=>{ if(optsList.children.length>2) row.remove(); else showToast("At least 2 options are required."); };
    optsList.appendChild(row);
  }
  addOptionInput("", true); addOptionInput("", false);
  typeSel.onchange = ()=> optsWrap.classList.toggle("hidden", typeSel.value!=="mcq");
  wrap.querySelector("#qAddOption").onclick = ()=> addOptionInput("", false);
  document.getElementById("qCancel").onclick = ()=>wrap.remove();
  document.getElementById("qSave").onclick = async ()=>{
    const text = document.getElementById("qText").value.trim();
    if(!text){ showToast("Enter a question first."); return; }
    const type = typeSel.value;
    const payload = { persona: state.persona, topic: state.topic, text, type };
    if(type==="mcq"){
      const options = [];
      let correctAnswer = null;
      Array.from(optsList.children).forEach(row=>{
        const val = row.querySelector("[data-opt]").value.trim();
        const isChecked = row.querySelector("[data-correct]").checked;
        if(val){ options.push(val); if(isChecked) correctAnswer = val; }
      });
      if(options.length<2){ showToast("Enter at least 2 non-empty options."); return; }
      if(!correctAnswer){ showToast("Mark which option is the correct answer."); return; }
      payload.options = options;
      payload.correctAnswer = correctAnswer;
    }
    try{
      await api("/api/admin/questions", {method:"POST", body: JSON.stringify(payload)});
      showToast("Question added.");
      loadAdminQuestions();
    }catch(e){ showToast("Save failed — admin access required."); }
  };
}

async function loadAdminSubs(){
  const el = document.getElementById("adminSubs");
  if(!el) return;
  el.innerHTML = "Loading…";
  let rows;
  try{ rows = await api("/api/admin/submissions?persona="+encodeURIComponent(state.persona)+"&topic="+encodeURIComponent(state.topic)); }
  catch(e){ el.innerHTML=`<div class="empty">Could not load submissions.</div>`; return; }
  if(rows.length===0){ el.innerHTML=`<div class="empty">No submissions yet for "${escapeHtml(state.topic)}".</div>`; return; }
  let bodyRows = "";
  rows.forEach(s=>{
    const scoreText = s.score ? `${s.score.correct}/${s.score.total}` : "—";
    bodyRows += `<tr><td>${s.uid?s.uid.slice(0,10):"?"}…</td><td>${new Date(s.submittedAt).toLocaleString()}</td><td>${Object.keys(s.answers||{}).length}</td><td>${scoreText}</td></tr>`;
  });
  el.innerHTML = `<table><tr><th>Viewer</th><th>Submitted</th><th>Answers</th><th>Score</th></tr>${bodyRows}</table>`;
}

function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
</body>
</html>
