<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d23; --muted:#6b7280; --border:#e3e5e9;
  --accent:#2f5496; --accent-2:#eaf0fb; --danger:#c0392b; --ok:#1f8a4c; --warn:#a86a00; --warn-bg:#fff3d9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1c1f26; --text:#eef0f3; --muted:#9aa1ac; --border:#2b2f38; --accent:#7fa6e0; --accent-2:#20293a; --warn-bg:#332a10;
  }
}
:root[data-theme="dark"]{ --bg:#14161a; --card:#1c1f26; --text:#eef0f3; --muted:#9aa1ac; --border:#2b2f38; --accent:#7fa6e0; --accent-2:#20293a; --warn-bg:#332a10; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
header{position:sticky;top:0;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;z-index:10;}
h1{font-size:17px;margin:0;}
.sub{color:var(--muted);font-size:12px;}
main{max-width:860px;margin:0 auto;padding:18px;}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.content-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;overflow-x:auto;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-2);color:var(--accent);margin-bottom:6px;}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.field{display:block;width:100%;padding:8px;margin:6px 0;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;}
label{font-size:12px;color:var(--muted);}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}
.section-title{font-size:15px;font-weight:600;margin:20px 0 4px;}
.empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;border:1px dashed var(--border);border-radius:10px;}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);margin-right:4px;}
.q-block{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.msg{font-size:13px;padding:10px;border-radius:8px;background:var(--accent-2);color:var(--accent);margin:10px 0;}
.msg-ok{background:#e6f6ec;color:var(--ok);}
.msg-warn{background:var(--warn-bg);color:var(--warn);}
.msg-danger{background:#fbe7e4;color:var(--danger);}
.hidden{display:none;}
.viewer-overlay{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column;}
.viewer-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#101114;flex-wrap:wrap;}
.viewer-header div.vh-title{color:#fff;font-weight:600;font-size:14px;}
.viewer-header div.vh-desc{color:#c9ccd3;font-size:12px;margin-top:2px;}
.viewer-header .btn{background:#26282f;color:#fff;border-color:#3a3d46;}
.viewer-media{flex:1;min-height:0;}
.card-narrow{max-width:440px;margin:30px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:pre-line;display:none;}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎯 LastMile Ready</h1>
    <div class="sub" id="crumbSub">Loading…</div>
  </div>
  <div class="top-actions">
    <button class="btn hidden" id="notifBtn">🔔</button>
    <button class="btn" id="homeBtn">🏠 Home</button>
    <button class="btn" id="authBtn">🔑 Login</button>
  </div>
</header>
<main id="app"></main>

<script>
const API = ""; // same origin
const PERSONAS = ["Scanner","Team Leader","Hub Manager and above","City Lead","Regional Manager"];
const ICONS = {"Scanner":"📦","Team Leader":"🧑‍🤝‍🧑","Hub Manager and above":"🏭","City Lead":"🏙️","Regional Manager":"🌍"};
const slug = p => p.replace(/[^a-zA-Z0-9]/g,"_");
const app = document.getElementById("app");
const crumbSub = document.getElementById("crumbSub");
const homeBtn = document.getElementById("homeBtn");
const notifBtn = document.getElementById("notifBtn");
const ASSIGNED_SEEN_KEY = "lmrSeenAssignedIds";

let deviceId=null; // this device's persistent identity (replaces Claude's user.id())
let state = { view:"loading" };
let kioskOverride = null;
try{ const saved = sessionStorage.getItem("kioskProfile"); if(saved) kioskOverride = JSON.parse(saved); }catch(e){}

function currentUid(){ return kioskOverride ? kioskOverride.id : deviceId; }

function ensureDeviceId(){
  deviceId = localStorage.getItem("lmrDeviceId");
  if(!deviceId){
    deviceId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"_"+Math.random().toString(36).slice(2)));
    localStorage.setItem("lmrDeviceId", deviceId);
  }
}

async function api(path, opts){
  const res = await fetch(API+path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err = new Error((data&&data.error)||"request_failed"); err.status=res.status; err.data=data; throw err; }
  return data;
}

function showToast(msg, ms){
  let t = document.getElementById("toastEl");
  if(!t){ t=document.createElement("div"); t.id="toastEl"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.display="none"; }, ms||4500);
}

async function init(){
  ensureDeviceId();
  homeBtn.onclick = goHome;
  notifBtn.onclick = ()=>{ const el=document.getElementById("assignedSection"); if(el) el.scrollIntoView({behavior:"smooth"}); };
  updateAuthBtn();
  goHome();
}

// True whenever someone is currently identified on screen — via kiosk PIN
// login, OR via this device's own auto-recognition. Logout needs to work
// either way, not just for kiosk logins.
let guestMode = false;
try{ guestMode = sessionStorage.getItem("guestMode")==="1"; }catch(e){}

function updateAuthBtn(){
  const btn = document.getElementById("authBtn");
  const activeName = kioskOverride ? kioskOverride.name
    : (!guestMode && state && state.view==="persona" && state.profile ? state.profile.name : null);
  if(kioskOverride || activeName){
    btn.textContent = "🔓 Logout" + (activeName ? " ("+activeName+")" : "");
    btn.onclick = logout;
  } else {
    btn.textContent = "🔑 Login";
    btn.onclick = ()=>{ state={view:"login"}; render(); };
  }
}

function logout(){
  if(kioskOverride){
    kioskOverride = null;
    sessionStorage.removeItem("kioskProfile");
  } else {
    // Signed in via this device's own auto-recognition (not a PIN login) —
    // log out for just this browser tab/session, without forgetting the
    // device itself. Closing the tab or logging in again both clear this.
    guestMode = true;
    try{ sessionStorage.setItem("guestMode","1"); }catch(e){}
  }
  goHome();
}

// ---------------- LOGIN (kiosk / shared device) ----------------
function renderLogin(){
  crumbSub.textContent = "Login (for shared/kiosk devices)";
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">🔑 Login</div>
    <p style="font-size:12px;color:var(--muted)">Already registered and approved? Log in here with your mobile number or email and your 4-digit PIN — useful on a shared hub device so training loads under your own name, not whoever used it before.</p>
    <label>Mobile Number or Email</label><input class="field" id="lId" placeholder="e.g. 98765xxxxx or you@company.com">
    <label>4-digit PIN</label><input class="field" id="lPin" maxlength="4" inputmode="numeric">
    <button class="btn btn-primary" id="lSubmit" style="width:100%;margin-top:8px">Login</button>
    <div id="lMsg"></div>
    <p style="font-size:12px;color:var(--muted);margin-top:14px">Not registered yet or don't have a PIN? <a href="#" id="lToRegister">Register here</a> instead.</p>
  </div>`;
  document.getElementById("lToRegister").onclick = (e)=>{ e.preventDefault(); state={view:"register"}; render(); };
  document.getElementById("lSubmit").onclick = async ()=>{
    const idVal = document.getElementById("lId").value.trim().toLowerCase();
    const pin = document.getElementById("lPin").value.trim();
    const msg = document.getElementById("lMsg");
    if(!idVal || !/^\d{4}$/.test(pin)){ msg.innerHTML = `<div class="msg msg-danger">Enter your mobile/email and a 4-digit PIN.</div>`; return; }
    try{
      const result = await api("/api/staff-login", {method:"POST", body: JSON.stringify({id:idVal, pin})});
      kioskOverride = { id: result.id, name: result.data.name, roles: result.data.roles || (result.data.role?[result.data.role]:[]), primaryRole: result.data.primaryRole, profile: result.data };
      sessionStorage.setItem("kioskProfile", JSON.stringify(kioskOverride));
      guestMode = false;
      try{ sessionStorage.removeItem("guestMode"); }catch(e){}
      goHome();
    }catch(e){
      if(e.status===404) msg.innerHTML = `<div class="msg msg-danger">No match found. Check your details or ask admin.</div>`;
      else msg.innerHTML = `<div class="msg msg-danger">Login failed. Please try again.</div>`;
    }
  };
}

async function goHome(){
  if(kioskOverride){
    state = { view:"persona", persona: kioskOverride.primaryRole || kioskOverride.roles[0] || PERSONAS[0], roles: kioskOverride.roles, profile: kioskOverride.profile, kiosk:true };
    updateAuthBtn(); return render();
  }
  if(guestMode){
    // Logged out of this device's own auto-recognition for now — show the
    // login/register screen instead of silently signing them back in.
    state = {view:"login"};
    updateAuthBtn(); return render();
  }
  try{
    const profJson = await api("/api/profile/"+deviceId);
    if(profJson.exists){
      const pdata = profJson.data;
      const roles = pdata.roles || (pdata.role ? [pdata.role] : []);
      state = { view:"persona", persona: pdata.primaryRole || roles[0] || PERSONAS[0], roles, profile: pdata };
      updateAuthBtn(); return render();
    }
    const regJson = await api("/api/registration/"+deviceId);
    if(regJson.exists){
      const r = regJson.data;
      if(r.status==="rejected"){ state={view:"rejected", reg:r}; updateAuthBtn(); return render(); }
      if(r.status==="revoked"){ state={view:"revoked", reg:r}; updateAuthBtn(); return render(); }
      state={view:"pending", reg:r}; updateAuthBtn(); return render();
    }
    state={view:"register"}; updateAuthBtn(); render();
  }catch(e){ state={view:"register"}; updateAuthBtn(); render(); }
}

function render(){
  if(state.view!=="persona") notifBtn.classList.add("hidden");
  if(state.view==="loading"){ app.innerHTML="Loading…"; return; }
  if(state.view==="nodb"){ crumbSub.textContent="Not signed in"; app.innerHTML=`<div class="empty">Sign in to your organization account to use this dashboard.</div>`; return; }
  if(state.view==="register") return renderRegister();
  if(state.view==="registerRM") return renderRegisterRM();
  if(state.view==="login") return renderLogin();
  if(state.view==="pending") return renderPending();
  if(state.view==="rejected") return renderRejected();
  if(state.view==="revoked") return renderRevoked();
  if(state.view==="persona") return renderPersona();
  if(state.view==="assessment") return renderAssessment();
}

// ---------------- REGISTRATION ----------------
// Flow: Name -> Mobile -> Email -> Role (Regional Manager is a separate
// path, see renderRegisterRM below) -> Reporting To (tagging picker,
// restricted to personas above the selected Role) -> City -> Hub/DC/FC
// (city/hub mapping applies) -> PIN. Saved as "pending"; the tagged
// person (or Super Admin, for Regional Manager) approves it.
let hubMappingCache = null;
async function loadHubMapping(){
  if(!hubMappingCache){ try{ hubMappingCache = await api("/api/hub-mapping"); }catch(e){ hubMappingCache = []; } }
  return hubMappingCache;
}
// Admin-defined extra registration fields (Super Admin's Form Builder).
// Rendered into whichever container div is passed, values read back the
// same way, on both the regular and Regional Manager registration forms.
let formFieldsCache = null;
async function loadFormFields(){
  if(!formFieldsCache){ try{ formFieldsCache = await api("/api/form-fields"); }catch(e){ formFieldsCache = []; } }
  return formFieldsCache;
}
async function renderCustomFieldsInto(containerId, existingValues){
  const container = document.getElementById(containerId);
  if(!container) return;
  const fields = await loadFormFields();
  const vals = existingValues || {};
  container.innerHTML = fields.map(f=>{
    const val = vals[f.fieldKey] || "";
    const reqStar = f.required ? " *" : "";
    if(f.type==="dropdown"){
      return `<label>${escapeHtml(f.label)}${reqStar}</label><select class="field" data-custom-field="${escapeAttr(f.fieldKey)}">
        <option value=""></option>
        ${f.options.map(o=>`<option value="${escapeAttr(o)}" ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("")}
      </select>`;
    }
    const inputType = f.type==="number" ? "number" : f.type==="date" ? "date" : "text";
    return `<label>${escapeHtml(f.label)}${reqStar}</label><input class="field" type="${inputType}" data-custom-field="${escapeAttr(f.fieldKey)}" value="${escapeAttr(val)}">`;
  }).join("");
}
function collectCustomFieldValues(containerId){
  const container = document.getElementById(containerId);
  if(!container) return {};
  const out = {};
  container.querySelectorAll("[data-custom-field]").forEach(el=>{ out[el.dataset.customField] = el.value.trim(); });
  return out;
}
function validateRequiredCustomFields(containerId, msgEl){
  const container = document.getElementById(containerId);
  if(!container) return true;
  let ok = true;
  container.querySelectorAll("[data-custom-field]").forEach(el=>{
    const label = el.previousElementSibling ? el.previousElementSibling.textContent : el.dataset.customField;
    if(label.trim().endsWith("*") && !el.value.trim()) ok = false;
  });
  if(!ok) msgEl.innerHTML = `<div class="msg msg-danger">Please fill in all required fields.</div>`;
  return ok;
}
// Reusable typeahead: only matching names are shown as you type. Used
// here for "Reporting To"; the same pattern is used in the admin panel
// wherever a user is searched.
function wireUserTypeahead({inputEl, hiddenIdEl, listEl, fetchCandidates}){
  let debounceTimer;
  inputEl.addEventListener("input", ()=>{
    hiddenIdEl.value = "";
    clearTimeout(debounceTimer);
    const q = inputEl.value.trim();
    debounceTimer = setTimeout(async ()=>{
      if(q.length<1){ listEl.innerHTML=""; listEl.classList.add("hidden"); return; }
      const candidates = await fetchCandidates(q);
      if(candidates.length===0){ listEl.innerHTML = `<div style="padding:6px;color:var(--muted);font-size:12px">No matching names.</div>`; listEl.classList.remove("hidden"); return; }
      listEl.innerHTML = candidates.map(c=>`<div class="typeahead-row" data-id="${escapeAttr(c.id)}" style="padding:6px;cursor:pointer;border-bottom:1px solid var(--border)"><b>${escapeHtml(c.name)}</b> <span style="color:var(--muted);font-size:12px">${escapeHtml(c.primaryRole||c.primary_role||"")} · ${escapeHtml(c.hub||"")}</span></div>`).join("");
      listEl.classList.remove("hidden");
      listEl.querySelectorAll("[data-id]").forEach(row=>{
        row.onclick = ()=>{
          hiddenIdEl.value = row.dataset.id;
          inputEl.value = row.querySelector("b").textContent;
          listEl.innerHTML=""; listEl.classList.add("hidden");
        };
      });
    }, 200);
  });
  inputEl.addEventListener("blur", ()=> setTimeout(()=>listEl.classList.add("hidden"), 150));
}
function renderRegister(prefill){
  crumbSub.textContent = "New user registration";
  const d = prefill || {};
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">Register for training access</div>
    <p style="color:var(--muted);font-size:12px">All fields below are required. Set your own 4-digit login PIN now — the person you tag as "Reporting To" reviews and approves your registration before the PIN will work.</p>
    <label>Full Name *</label><input class="field" id="rName" value="${escapeAttr(d.name)}">
    <label>Mobile Number *</label><input class="field" id="rPhone" value="${escapeAttr(d.phone)}">
    <label>Email ID *</label><input class="field" id="rEmail" type="email" value="${escapeAttr(d.email)}">
    <label>Designated Role *</label>
    <select class="field" id="rRole"></select>
    <label>Reporting To (search by name) *</label>
    <input class="field" id="rTaggedSearch" placeholder="Start typing a name…" autocomplete="off">
    <input type="hidden" id="rTaggedId">
    <div id="rTaggedList" class="hidden" style="border:1px solid var(--border);border-radius:6px;max-height:160px;overflow-y:auto;margin-top:-6px;margin-bottom:10px"></div>
    <label>City Name *</label><input class="field" id="rCity" list="rCityList" value="${escapeAttr(d.city)}">
    <datalist id="rCityList"></datalist>
    <label>Hub / DC / FC Name *</label><input class="field" id="rHub" list="rHubList" value="${escapeAttr(d.hub)}">
    <datalist id="rHubList"></datalist>
    <label>Set a 4-digit PIN (for logging in on shared/kiosk devices) *</label>
    <input class="field" id="rPin" maxlength="4" inputmode="numeric" placeholder="e.g. 4821" value="${escapeAttr(d.pin)}">
    <div id="rCustomFields"></div>
    <button class="btn btn-primary" id="rSubmit" style="width:100%;margin-top:8px">Submit for Approval</button>
    <div id="rMsg"></div>
    <p style="text-align:center;margin-top:10px"><a href="#" id="rmLink" style="font-size:12px;color:var(--muted)">Registering as a Regional Manager? Register here instead</a></p>
  </div>`;

  renderCustomFieldsInto("rCustomFields", d.customFields);
  const sel = document.getElementById("rRole");
  PERSONAS.filter(p=>p!=="Regional Manager").forEach(p=>{ const o=document.createElement("option"); o.value=p; o.textContent=p; if(p===d.role) o.selected=true; sel.appendChild(o); });
  document.getElementById("rmLink").onclick = (e)=>{ e.preventDefault(); state={view:"registerRM"}; render(); };

  const taggedInput = document.getElementById("rTaggedSearch");
  const taggedList = document.getElementById("rTaggedList");
  wireUserTypeahead({
    inputEl: taggedInput, hiddenIdEl: document.getElementById("rTaggedId"), listEl: taggedList,
    fetchCandidates: async (q)=>{ try{ return await api("/api/tag-candidates?forRole="+encodeURIComponent(sel.value)+"&q="+encodeURIComponent(q)); }catch(e){ return []; } }
  });
  sel.onchange = ()=>{ taggedInput.value=""; document.getElementById("rTaggedId").value=""; };

  loadHubMapping().then(mapping=>{
    const cities = [...new Set(mapping.map(m=>m.city))];
    document.getElementById("rCityList").innerHTML = cities.map(c=>`<option value="${escapeAttr(c)}">`).join("");
    const cityInput = document.getElementById("rCity");
    const hubList = document.getElementById("rHubList");
    function refreshHubOptions(){
      const cityVal = cityInput.value.trim().toLowerCase();
      const matches = mapping.filter(m=>m.city.trim().toLowerCase()===cityVal);
      const pool = matches.length ? matches : mapping;
      hubList.innerHTML = [...new Set(pool.map(m=>m.hub))].map(h=>`<option value="${escapeAttr(h)}">`).join("");
    }
    cityInput.addEventListener("input", refreshHubOptions);
    refreshHubOptions();
  });

  document.getElementById("rSubmit").onclick = async ()=>{
    const msgEl = document.getElementById("rMsg");
    const pin = document.getElementById("rPin").value.trim();
    const taggedTo = document.getElementById("rTaggedId").value;
    const data = {
      uid: deviceId,
      name: document.getElementById("rName").value.trim(),
      phone: document.getElementById("rPhone").value.trim().toLowerCase(),
      email: document.getElementById("rEmail").value.trim().toLowerCase(),
      city: document.getElementById("rCity").value.trim(),
      hub: document.getElementById("rHub").value.trim(),
      role: sel.value,
      pin, taggedTo,
      customFields: collectCustomFieldValues("rCustomFields")
    };
    if(!data.name || !data.phone || !data.email || !data.hub || !data.city){
      msgEl.innerHTML=`<div class="msg msg-danger">All fields are required.</div>`; return;
    }
    if(!taggedTo){ msgEl.innerHTML=`<div class="msg msg-danger">Pick who you report to from the search results — typing a name alone isn't enough.</div>`; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){ msgEl.innerHTML=`<div class="msg msg-danger">Enter a valid email address (e.g. name@company.com).</div>`; return; }
    if(!/^\d{7,15}$/.test(data.phone.replace(/[\s\-+]/g,""))){ msgEl.innerHTML=`<div class="msg msg-danger">Enter a valid mobile number.</div>`; return; }
    if(!/^\d{4}$/.test(pin)){ msgEl.innerHTML=`<div class="msg msg-danger">PIN must be exactly 4 digits.</div>`; return; }
    if(!validateRequiredCustomFields("rCustomFields", msgEl)) return;
    try{
      const saved = await api("/api/register", {method:"POST", body: JSON.stringify(data)});
      state={view:"pending", reg:saved}; render();
    }catch(e){ msgEl.innerHTML=`<div class="msg msg-danger">Could not submit. Please try again.</div>`; }
  };
}

// Regional Manager sits at the top of the tagging hierarchy — no one to
// report to — so their registration skips tagging entirely and is
// approved directly by Super Admin instead.
function renderRegisterRM(prefill){
  crumbSub.textContent = "Regional Manager registration";
  const d = prefill || {};
  app.innerHTML = `<div class="card-narrow">
    <div class="section-title" style="margin-top:0">Register as Regional Manager</div>
    <p style="color:var(--muted);font-size:12px">Regional Manager has no one to report to, so this goes straight to Super Admin for approval.</p>
    <label>Full Name *</label><input class="field" id="rmName" value="${escapeAttr(d.name)}">
    <label>Mobile Number *</label><input class="field" id="rmPhone" value="${escapeAttr(d.phone)}">
    <label>Email ID *</label><input class="field" id="rmEmail" type="email" value="${escapeAttr(d.email)}">
    <label>City Name *</label><input class="field" id="rmCity" list="rmCityList" value="${escapeAttr(d.city)}">
    <datalist id="rmCityList"></datalist>
    <label>Hub / DC / FC Name *</label><input class="field" id="rmHub" list="rmHubList" value="${escapeAttr(d.hub)}">
    <datalist id="rmHubList"></datalist>
    <label>Set a 4-digit PIN *</label>
    <input class="field" id="rmPin" maxlength="4" inputmode="numeric" value="${escapeAttr(d.pin)}">
    <div id="rmCustomFields"></div>
    <button class="btn btn-primary" id="rmSubmit" style="width:100%;margin-top:8px">Submit for Super Admin Approval</button>
    <div id="rmMsg"></div>
    <p style="text-align:center;margin-top:10px"><a href="#" id="backLink" style="font-size:12px;color:var(--muted)">Back to regular registration</a></p>
  </div>`;
  renderCustomFieldsInto("rmCustomFields", d.customFields);
  document.getElementById("backLink").onclick = (e)=>{ e.preventDefault(); state={view:"register"}; render(); };
  loadHubMapping().then(mapping=>{
    const cities = [...new Set(mapping.map(m=>m.city))];
    document.getElementById("rmCityList").innerHTML = cities.map(c=>`<option value="${escapeAttr(c)}">`).join("");
    const cityInput = document.getElementById("rmCity");
    const hubList = document.getElementById("rmHubList");
    function refreshHubOptions(){
      const cityVal = cityInput.value.trim().toLowerCase();
      const matches = mapping.filter(m=>m.city.trim().toLowerCase()===cityVal);
      const pool = matches.length ? matches : mapping;
      hubList.innerHTML = [...new Set(pool.map(m=>m.hub))].map(h=>`<option value="${escapeAttr(h)}">`).join("");
    }
    cityInput.addEventListener("input", refreshHubOptions);
    refreshHubOptions();
  });
  document.getElementById("rmSubmit").onclick = async ()=>{
    const msgEl = document.getElementById("rmMsg");
    const pin = document.getElementById("rmPin").value.trim();
    const data = {
      uid: deviceId,
      name: document.getElementById("rmName").value.trim(),
      phone: document.getElementById("rmPhone").value.trim().toLowerCase(),
      email: document.getElementById("rmEmail").value.trim().toLowerCase(),
      city: document.getElementById("rmCity").value.trim(),
      hub: document.getElementById("rmHub").value.trim(),
      role: "Regional Manager",
      pin,
      customFields: collectCustomFieldValues("rmCustomFields")
    };
    if(!data.name || !data.phone || !data.email || !data.hub || !data.city){ msgEl.innerHTML=`<div class="msg msg-danger">All fields are required.</div>`; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){ msgEl.innerHTML=`<div class="msg msg-danger">Enter a valid email address.</div>`; return; }
    if(!/^\d{7,15}$/.test(data.phone.replace(/[\s\-+]/g,""))){ msgEl.innerHTML=`<div class="msg msg-danger">Enter a valid mobile number.</div>`; return; }
    if(!/^\d{4}$/.test(pin)){ msgEl.innerHTML=`<div class="msg msg-danger">PIN must be exactly 4 digits.</div>`; return; }
    if(!validateRequiredCustomFields("rmCustomFields", msgEl)) return;
    try{
      const saved = await api("/api/register", {method:"POST", body: JSON.stringify(data)});
      state={view:"pending", reg:saved}; render();
    }catch(e){ msgEl.innerHTML=`<div class="msg msg-danger">Could not submit. Please try again.</div>`; }
  };
}

async function loadMyApprovals(){

// Full downstream tree (Regional Manager sees every level below them —
// City Lead, Hub Manager and above, Team Leader, Scanner — not just
// direct reports; Hub Manager and above / City Lead see their own direct
// reports, same as before). Grouped by role level, each person's
// Assigned/Completed/Pending numbers are clickable and open the
// topic-wise breakdown for that one person below the list.
async function loadMyTeamList(){
  const el = document.getElementById("myTeamList");
  try{
    const { team } = await api("/api/my-team?uid="+encodeURIComponent(currentUid()));
    if(team.length===0){ el.innerHTML = `<div class="empty">No one tagged to you yet.</div>`; return; }
    const groups = new Map(); // role -> [{id,data,status}]
    PERSONAS.forEach(role=>{
      const inRole = team.filter(t=>(t.data.primaryRole||"")===role);
      if(inRole.length) groups.set(role, inRole);
    });
    // anyone whose primaryRole doesn't match a known persona still shows, grouped under a catch-all
    const unknown = team.filter(t=> !PERSONAS.includes(t.data.primaryRole||""));
    if(unknown.length) groups.set("Other", unknown);

    let html = "";
    groups.forEach((people, role)=>{
      html += `<div style="font-weight:600;font-size:13px;margin:10px 0 4px">${escapeHtml(role)} (${people.length})</div>`;
      people.forEach(({id,data:p,status})=>{
        const s = status || {assigned:0,completed:0,pending:0,ongoing:0};
        html += `<div style="padding:6px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
            <span style="font-size:13px"><b>${escapeHtml(p.name)}</b> · ${escapeHtml(p.hub||"")}</span>
            <button class="btn btn-sm btn-danger" data-revoke="${escapeAttr(id)}">Revoke</button>
          </div>
          <div class="top-actions" style="margin-top:4px">
            <button class="btn btn-sm" data-detail="${escapeAttr(id)}">Assigned: ${s.assigned}</button>
            <button class="btn btn-sm" data-detail="${escapeAttr(id)}" style="color:var(--ok)">Completed: ${s.completed}</button>
            <button class="btn btn-sm" data-detail="${escapeAttr(id)}" style="color:var(--danger)">Pending: ${s.pending}</button>
          </div>
        </div>`;
      });
    });
    el.innerHTML = html;
    el.querySelectorAll("[data-detail]").forEach(btn=>{
      btn.onclick = ()=> loadMyTeamMemberDetail(btn.dataset.detail);
    });
    el.querySelectorAll("[data-revoke]").forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm("Revoke this user's access?")) return;
        try{ await api("/api/my-team/"+btn.dataset.revoke+"/revoke", {method:"POST", body: JSON.stringify({uid: currentUid()})}); loadMyTeamList(); }
        catch(e){ showToast("Could not revoke."); }
      };
    });
  }catch(e){ el.innerHTML = `<div class="empty">Could not load team.</div>`; }
}

async function loadContentAndProgress(p){
  const container = document.getElementById("topicGroups");
  try{
    currentContentDocs = await api("/api/content?persona="+encodeURIComponent(p));
  }catch(e){ container.innerHTML = `<div class="empty">Could not load content.</div>`; return; }
  try{
    const progJson = await api("/api/progress?persona="+encodeURIComponent(p)+"&uid="+encodeURIComponent(currentUid()));
    currentProgress = progJson.completed || {};
  }catch(e){ currentProgress = {}; }
  renderTopicGroups(p);
}

// Groups the persona's content by its "topic" (the module name set at
// upload time). Each group gets its own progress note + "Take Assessment"
// button, which only unlocks once every content item *in that group* is
// complete — so one persona can have several independent module quizzes
// instead of a single all-or-nothing assessment.
function groupByTopic(docs){
  const map = new Map();
  docs.forEach(item=>{
    const t = (item.data.topic && item.data.topic.trim()) || "General";
    if(!map.has(t)) map.set(t, []);
    map.get(t).push(item);
  });
  return map;
}

function renderTopicGroups(p){
  const container = document.getElementById("topicGroups");
  if(currentContentDocs.length===0){
    // No content at all yet — fall back to a single persona-wide
    // assessment under the "General" topic, same as the old behavior.
    container.innerHTML = `<div class="empty">No training content added yet for ${p}.</div>
    <div class="content-card row" style="margin-top:10px;align-items:center">
      <div><b>General</b> assessment</div>
      <button class="btn btn-primary btn-sm" id="genAssessBtn">📝 Take Assessment</button>
    </div>`;
    document.getElementById("genAssessBtn").onclick = ()=>{ state.view="assessment"; state.topic="General"; render(); };
    return;
  }
  const groups = groupByTopic(currentContentDocs);
  container.innerHTML = "";
  groups.forEach((items, topic)=>{
    const section = document.createElement("div");
    section.style.marginBottom = "24px";
    let doneCount = 0;
    let cardsHtml = "";
    items.forEach(({id,data:c})=>{
      const done = !!currentProgress[id];
      if(done) doneCount++;
      cardsHtml += `<div class="content-card" data-content-id="${escapeAttr(id)}">
        <span class="tag">${contentIcon(c.type)} ${(c.type||"link").toUpperCase()}</span>
        ${done ? '<span class="tag" style="background:#e6f6ec;color:var(--ok)">✅ Completed</span>' : ""}
        <h3 style="margin:4px 0">${escapeHtml(c.title||"Untitled")}</h3>
        <p style="color:var(--muted);font-size:13px;margin:4px 0">${escapeHtml(c.description||"")}</p>
        <button class="btn btn-primary btn-sm" data-view>${done ? "▶ View again" : "▶ View full screen"}</button>
      </div>`;
    });
    const allDone = doneCount>=items.length;
    section.innerHTML = `<div class="row" style="align-items:center;margin-top:6px">
      <div class="section-title" style="margin:8px 0 4px">📘 ${escapeHtml(topic)}</div>
      <button class="btn btn-primary btn-sm" data-topic-assess ${allDone?"":"disabled"}>📝 Take Assessment</button>
    </div>
    ${allDone ? "" : `<div class="msg msg-warn">Complete all content in this module to unlock its assessment (${doneCount}/${items.length} done).</div>`}
    ${cardsHtml}`;
    container.appendChild(section);
    items.forEach(({id,data:c})=>{
      section.querySelector(`[data-content-id="${CSS.escape(id)}"] [data-view]`).onclick = ()=> openContentViewer(p, id, c);
    });
    const assessBtn = section.querySelector("[data-topic-assess]");
    assessBtn.onclick = allDone ? (()=>{ state.view="assessment"; state.topic=topic; render(); }) : null;
  });
}

// ---- Multi-role: merged view, grouped Pending / Completed ----
let multiGroups = []; // [{persona, topic, items:[{id,data,done}], allDone}]

async function renderMultiPersona(roles){
  crumbSub.textContent = `Signed in as ${state.profile?.name||""} · Roles: ${roles.join(", ")}${state.kiosk?" · 🔑 kiosk login":""}`;
  app.innerHTML = `<div class="row"><div class="section-title" style="margin:0">🎓 Training Content</div>
  <div class="top-actions">
    <button class="btn btn-sm" id="wrongRole">${state.kiosk?"Not you? Logout":"Wrong role? Request change"}</button>
  </div></div>
  <p style="color:var(--muted);font-size:12px;margin-top:-4px">You're assigned multiple roles (${roles.map(r=>escapeHtml(r)).join(", ")}) — everything is shown below, split into Pending and Completed.</p>
  <div id="assignedSection"></div>
  <div id="multiGroups">Loading…</div>`;
  document.getElementById("wrongRole").onclick = ()=> state.kiosk ? logout() : renderRegister(state.profile);
  await loadMultiPersonaContent(roles);
  loadAndRenderAssigned();
}

async function loadMultiPersonaContent(roles){
  const container = document.getElementById("multiGroups");
  multiGroups = [];
  for(const p of roles){
    let docs = [];
    try{ docs = await api("/api/content?persona="+encodeURIComponent(p)); }catch(e){}
    let completedMap = {};
    try{
      const progJson = await api("/api/progress?persona="+encodeURIComponent(p)+"&uid="+encodeURIComponent(currentUid()));
      completedMap = progJson.completed || {};
    }catch(e){}
    groupByTopic(docs).forEach((items, topic)=>{
      const withStatus = items.map(({id,data:c})=>({id, data:c, done: !!completedMap[id]}));
      multiGroups.push({ persona:p, topic, items:withStatus, allDone: withStatus.length>0 && withStatus.every(i=>i.done) });
    });
  }
  renderMultiGroups();
}

function renderMultiGroups(){
  const container = document.getElementById("multiGroups");
  if(multiGroups.length===0){ container.innerHTML = `<div class="empty">No training content added yet for your assigned roles.</div>`; return; }
  const pending = multiGroups.filter(g=>!g.allDone);
  const completed = multiGroups.filter(g=>g.allDone);
  container.innerHTML = "";

  const pendingHeader = document.createElement("div");
  pendingHeader.className = "section-title";
  pendingHeader.style.marginTop = "6px";
  pendingHeader.textContent = "⏳ Pending";
  container.appendChild(pendingHeader);
  if(pending.length===0){
    const e = document.createElement("div"); e.className="empty"; e.textContent="Nothing pending — you're all caught up 🎉";
    container.appendChild(e);
  } else {
    pending.forEach(g=> container.appendChild(renderGroupCard(g)));
  }

  const completedHeader = document.createElement("div");
  completedHeader.className = "section-title";
  completedHeader.style.marginTop = "24px";
  completedHeader.textContent = "✅ Completed";
  container.appendChild(completedHeader);
  if(completed.length===0){
    const e = document.createElement("div"); e.className="empty"; e.textContent="Nothing completed yet.";
    container.appendChild(e);
  } else {
    completed.forEach(g=> container.appendChild(renderGroupCard(g)));
  }
}

function renderGroupCard(g){
  const section = document.createElement("div");
  section.style.marginBottom = "18px";
  const doneCount = g.items.filter(i=>i.done).length;
  let cardsHtml = "";
  g.items.forEach(({id,data:c,done})=>{
    cardsHtml += `<div class="content-card" data-content-id="${escapeAttr(id)}">
      <span class="tag">${contentIcon(c.type)} ${(c.type||"link").toUpperCase()}</span>
      ${done ? '<span class="tag" style="background:#e6f6ec;color:var(--ok)">✅ Completed</span>' : ""}
      <h3 style="margin:4px 0">${escapeHtml(c.title||"Untitled")}</h3>
      <p style="color:var(--muted);font-size:13px;margin:4px 0">${escapeHtml(c.description||"")}</p>
      <button class="btn btn-primary btn-sm" data-view>${done ? "▶ View again" : "▶ View full screen"}</button>
    </div>`;
  });
  section.innerHTML = `<div class="row" style="align-items:center">
    <div style="font-size:13px;font-weight:600">${ICONS[g.persona]||"🎓"} ${escapeHtml(g.persona)} — 📘 ${escapeHtml(g.topic)}</div>
    <button class="btn btn-primary btn-sm" data-group-assess ${g.allDone?"":"disabled"}>📝 Take Assessment</button>
  </div>
  ${g.allDone ? "" : `<div class="msg msg-warn" style="margin-top:6px">Complete all content in this module to unlock its assessment (${doneCount}/${g.items.length} done).</div>`}
  ${cardsHtml}`;
  g.items.forEach(({id,data:c})=>{
    section.querySelector(`[data-content-id="${CSS.escape(id)}"] [data-view]`).onclick = ()=> openContentViewer(g.persona, id, c);
  });
  const assessBtn = section.querySelector("[data-group-assess]");
  assessBtn.onclick = g.allDone ? (()=>{ state.persona=g.persona; state.view="assessment"; state.topic=g.topic; render(); }) : null;
  return section;
}

// ---- Assigned content (pushed to a specific user by an admin) ----
async function loadAssignedContent(){
  const uid = currentUid();
  let items = [];
  try{ items = await api("/api/assigned-content?uid="+encodeURIComponent(uid)); }catch(e){ items = []; }
  const progCache = {};
  for(const item of items){
    const p = item.data.persona;
    if(!(p in progCache)){
      try{ const j = await api("/api/progress?persona="+encodeURIComponent(p)+"&uid="+encodeURIComponent(uid)); progCache[p] = j.completed || {}; }
      catch(e){ progCache[p] = {}; }
    }
    item.done = !!progCache[p][item.id];
  }
  return items;
}

function fmtDue(ts){
  if(!ts) return "";
  const overdue = ts < Date.now();
  return `<span class="pill" style="${overdue?"color:var(--danger);border-color:var(--danger)":""}">${overdue?"⚠ Overdue: ":"Due: "}${new Date(ts).toLocaleDateString()}</span>`;
}

// Looks up topic-level completion the same way the rest of the dashboard
// does — based on ALL content in that persona+topic, not just the items
// assigned to this user — so "Take Assessment" unlocks at exactly the
// same point everywhere in the app.
function getTopicCompletion(persona, topic){
  if(state.multi){
    const g = multiGroups.find(x=>x.persona===persona && x.topic===topic);
    if(!g) return null;
    return { doneCount: g.items.filter(i=>i.done).length, total: g.items.length, allDone: g.allDone };
  }
  if(persona !== state.persona) return null;
  const groups = groupByTopic(currentContentDocs);
  const items = groups.get(topic) || [];
  const doneCount = items.filter(({id})=> !!currentProgress[id]).length;
  return { doneCount, total: items.length, allDone: items.length>0 && doneCount>=items.length };
}

function groupAssignedByTopic(items){
  const map = new Map(); // key: persona+"::"+topic
  items.forEach(item=>{
    const persona = item.data.persona;
    const topic = item.data.topic || "General";
    const key = persona+"::"+topic;
    if(!map.has(key)) map.set(key, {persona, topic, items:[]});
    map.get(key).items.push(item);
  });
  return map;
}

function renderAssignedSection(items){
  if(!items || items.length===0) return "";
  let html = `<div class="section-title" style="margin-top:6px">📌 Assigned to You</div>
  <p style="color:var(--muted);font-size:12px;margin-top:-4px">Content specifically assigned to you by an admin, in addition to your regular role-based training.</p>`;
  const groups = groupAssignedByTopic(items);
  groups.forEach(({persona, topic, items:groupItems})=>{
    const pending = groupItems.filter(i=>!i.done);
    const completed = groupItems.filter(i=>i.done);
    const comp = getTopicCompletion(persona, topic);
    const allDone = comp ? comp.allDone : groupItems.every(i=>i.done);
    html += `<div class="row" style="align-items:center;margin-top:10px">
      <div style="font-size:13px;font-weight:600">${ICONS[persona]||"🎓"} ${escapeHtml(persona)} — 📘 ${escapeHtml(topic)}</div>
      <button class="btn btn-primary btn-sm" data-assigned-assess="${escapeAttr(persona)}::${escapeAttr(topic)}" ${allDone?"":"disabled"}>📝 Take Assessment</button>
    </div>`;
    if(!allDone && comp){
      html += `<div class="msg msg-warn" style="margin-top:4px">Complete all content in this module to unlock its assessment (${comp.doneCount}/${comp.total} done).</div>`;
    } else if(pending.length>0){
      html += `<div class="msg msg-warn" style="margin-top:4px">${pending.length} assigned item(s) in this module still pending.</div>`;
    }
    pending.forEach(({id,data:c})=>{
      html += `<div class="content-card" data-assigned-id="${escapeAttr(id)}">
        <span class="tag">${contentIcon(c.type)} ${(c.type||"link").toUpperCase()}</span>
        ${c.dueDate ? fmtDue(c.dueDate) : ""}
        <h3 style="margin:4px 0">${escapeHtml(c.title||"Untitled")}</h3>
        <p style="color:var(--muted);font-size:13px;margin:4px 0">${escapeHtml(c.description||"")}</p>
        <button class="btn btn-primary btn-sm" data-view>▶ View full screen</button>
      </div>`;
    });
    completed.forEach(({id,data:c})=>{
      html += `<div class="content-card" data-assigned-id="${escapeAttr(id)}">
        <span class="tag">${contentIcon(c.type)} ${(c.type||"link").toUpperCase()}</span>
        <span class="tag" style="background:#e6f6ec;color:var(--ok)">✅ Completed</span>
        <h3 style="margin:4px 0">${escapeHtml(c.title||"Untitled")}</h3>
        <button class="btn btn-primary btn-sm" data-view>▶ View again</button>
      </div>`;
    });
  });
  return html;
}

function wireAssignedSection(container, items){
  items.forEach(({id,data:c})=>{
    const card = container.querySelector(`[data-assigned-id="${CSS.escape(id)}"]`);
    if(card) card.querySelector("[data-view]").onclick = ()=> openContentViewer(c.persona, id, c);
  });
  container.querySelectorAll("[data-assigned-assess]").forEach(btn=>{
    if(btn.disabled) return;
    const [persona, topic] = btn.dataset.assignedAssess.split("::");
    btn.onclick = ()=>{ state.persona = persona; state.view = "assessment"; state.topic = topic; render(); };
  });
}

function updateNotifBadge(pendingCount){
  if(pendingCount>0){ notifBtn.classList.remove("hidden"); notifBtn.textContent = "🔔 "+pendingCount; }
  else notifBtn.classList.add("hidden");
}

// "Push notification" for this page-based app: a toast fires the first
// time a given assigned item is seen pending, tracked in localStorage so
// it doesn't repeat on every page load.
function maybeToastNewAssignments(items){
  let seen = [];
  try{ seen = JSON.parse(localStorage.getItem(ASSIGNED_SEEN_KEY)||"[]"); }catch(e){}
  const pendingIds = items.filter(i=>!i.done).map(i=>i.id);
  const newOnes = pendingIds.filter(id=>!seen.includes(id));
  if(newOnes.length>0) showToast(`🔔 ${newOnes.length} new task(s) assigned to you`, 6000);
  localStorage.setItem(ASSIGNED_SEEN_KEY, JSON.stringify(items.map(i=>i.id)));
}

async function loadAndRenderAssigned(){
  const el = document.getElementById("assignedSection");
  if(!el) return;
  const items = await loadAssignedContent();
  el.innerHTML = renderAssignedSection(items);
  wireAssignedSection(el, items);
  updateNotifBadge(items.filter(i=>!i.done).length);
  maybeToastNewAssignments(items);
}

// Everything (video, ppt, doc, link) opens full-screen over the dashboard —
// the person never navigates to another page or tab to watch/read it.
// Completion is tracked per user per content item:
//  - video: gated on actual accumulated PLAY time (pauses don't count,
//    and seek-ahead jumps aren't counted as watched) reaching the
//    admin-set required duration for that video
//  - ppt/doc/link: no reliable "finished reading" signal exists for an
//    embedded/cross-origin viewer, so a short mandatory dwell timer gates
//    a "Mark as completed" button — it can't be clicked the instant the
//    item is opened.
function openContentViewer(persona, contentId, c){
  const already = !!currentProgress[contentId];
  const isVideo = c.type==="video";
  const isYoutube = c.type==="youtube";
  const youtubeId = isYoutube ? extractYoutubeId(c.url) : null;
  const overlay = document.createElement("div");
  overlay.className = "viewer-overlay";
  let mediaHtml;
  if(isVideo){
    mediaHtml = `<video id="viewerVideo" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000" src="${escapeAttr(c.url||"")}"></video>`;
  } else if(isYoutube){
    // Filled in by the YouTube IFrame API below, not by this markup directly —
    // that's what lets us track real watch time (play/pause/seek) the same
    // way the native <video> element does above, instead of just embedding
    // a plain iframe we'd have no visibility into.
    mediaHtml = youtubeId
      ? `<div id="ytPlayer-${contentId}" style="width:100%;height:100%;background:#000"></div>`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#f66">Couldn't read a YouTube video ID from this content's URL.</div>`;
  } else if(c.type==="ppt" || c.type==="doc"){
    const embedUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(c.url||"");
    mediaHtml = `<iframe src="${escapeAttr(embedUrl)}" style="width:100%;height:100%;border:none;background:#fff" allowfullscreen></iframe>`;
  } else if(c.type==="image"){
    mediaHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111"><img src="${escapeAttr(c.url||"")}" style="max-width:100%;max-height:100%;object-fit:contain"></div>`;
  } else {
    mediaHtml = `<iframe src="${escapeAttr(c.url||"")}" style="width:100%;height:100%;border:none;background:#fff"></iframe>`;
  }
  overlay.innerHTML = `
    <div class="viewer-header">
      <div>
        <div class="vh-title">${escapeHtml(c.title||"Untitled")}</div>
        <div class="vh-desc">${escapeHtml(c.description||"")}</div>
      </div>
      <div class="top-actions">
        <button class="btn btn-sm" id="markDoneBtn" disabled>${already ? "✅ Completed" : "⏳ Wait…"}</button>
        <button class="btn btn-sm" id="closeViewer">✕ Close</button>
      </div>
    </div>
    <div class="viewer-media">${mediaHtml}</div>`;
  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
  const btn = document.getElementById("markDoneBtn");

  overlay._doClose = ()=>{
    if(overlay._timer) clearInterval(overlay._timer);
    if(overlay._ytStop) overlay._ytStop();
    document.body.style.overflow = "";
    overlay.remove();
  };
  document.getElementById("closeViewer").onclick = overlay._doClose;

  // The YouTube player has to exist (so the video is actually visible)
  // whether or not this is already completed — gating only decides
  // whether we also track watch time toward unlocking the button.
  if(isYoutube && youtubeId) initYoutubePlayer(overlay, contentId, youtubeId, already ? null : {persona, c, btn});

  if(!already){
    api("/api/progress/start", {method:"POST", body: JSON.stringify({persona, uid: currentUid(), contentId})}).catch(()=>{});
    if(isVideo) setupVideoGate(overlay, persona, contentId, c, btn);
    else if(!isYoutube) setupDwellGate(overlay, btn, ()=> markContentComplete(persona, contentId));
  }
}


function setupDwellGate(overlay, btn, onDone){
  let secondsLeft = 8;
  btn.textContent = `⏳ Wait ${secondsLeft}s…`;
  overlay._timer = setInterval(()=>{
    secondsLeft--;
    if(secondsLeft<=0){
      clearInterval(overlay._timer);
      btn.disabled = false;
      btn.textContent = "✅ Mark as completed";
      btn.onclick = ()=>{ onDone(); overlay._doClose(); };
      const closeBtn = document.getElementById("closeViewer");
      if(closeBtn) closeBtn.style.display = "none";
    } else {
      btn.textContent = `⏳ Wait ${secondsLeft}s…`;
    }
  }, 1000);
}

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

// Accepts a full YouTube URL (watch/youtu.be/embed/shorts) or a bare video ID.
function extractYoutubeId(url){
  url = String(url||"").trim();
  let m = /[?&]v=([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  m = /youtu\.be\/([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  m = /youtube\.com\/(?:embed|shorts)\/([a-zA-Z0-9_-]{6,})/.exec(url); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{6,}$/.test(url)) return url;
  return null;
}

// Loads YouTube's IFrame Player API once (shared across every video opened
// in this session) and resolves when window.YT.Player is ready to use.
let _ytApiPromise = null;
function loadYoutubeApi(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(_ytApiPromise) return _ytApiPromise;
  _ytApiPromise = new Promise((resolve)=>{
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prevCb) prevCb(); resolve(); };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  });
  return _ytApiPromise;
}

// Mirrors setupVideoGate's logic (accumulate real play time, ignore
// pauses and seek-ahead jumps, unlock once the required watch time is
// reached) but driven by the YouTube IFrame Player API's state-change
// events + getCurrentTime() instead of a native <video> element, since an
// embedded Drive/plain iframe gives JS no visibility into playback at all.
// `gate` is {persona, c, btn} to enforce watch time, or null/undefined to
// just play the video with no gating (used for already-completed items).
function initYoutubePlayer(overlay, contentId, videoId, gate){
  loadYoutubeApi().then(()=>{
    if(!document.body.contains(overlay)) return; // closed before the API finished loading
    const requiredSeconds = (gate && gate.c.requiredMinutes) ? Math.round(gate.c.requiredMinutes*60) : null;
    let pollTimer = null, playedSeconds = 0, lastTime = 0, unlocked = false;
    let furthest = 0; // furthest point reached through genuine, un-skipped forward playback

    const unlock = ()=>{
      if(!gate || unlocked) return;
      unlocked = true;
      gate.btn.disabled = false;
      gate.btn.textContent = "✅ Mark as completed";
      gate.btn.onclick = ()=>{ markContentComplete(gate.persona, contentId); overlay._doClose(); };
      const closeBtn = document.getElementById("closeViewer");
      if(closeBtn) closeBtn.style.display = "none";
    };
    const updateLabel = ()=>{
      if(!gate || unlocked) return;
      gate.btn.textContent = requiredSeconds ? `⏳ Watched ${fmtTime(playedSeconds)} / ${fmtTime(requiredSeconds)}` : "⏳ Watch to the end…";
    };
    updateLabel();

    const player = new YT.Player("ytPlayer-"+contentId, {
      videoId,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onStateChange: (e)=>{
          if(!gate) return; // playback only, nothing to gate
          if(e.data === YT.PlayerState.PLAYING){
            const cur = player.getCurrentTime();
            // Forwarding/skipping ahead is blocked outright — covers both
            // dragging the scrubber while paused and resuming after one.
            if(cur > furthest + 1){
              player.seekTo(furthest, true);
              showToast("Skipping ahead isn't allowed — please watch through.");
              lastTime = furthest;
            } else {
              lastTime = cur;
            }
            if(pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(()=>{
              const cur = player.getCurrentTime();
              const delta = cur - lastTime;
              if(delta > 1.5){
                // a jump this size mid-playback is a scrubber drag/seek —
                // snap straight back to the furthest genuinely-watched point
                player.seekTo(furthest, true);
                showToast("Skipping ahead isn't allowed — please watch through.");
                lastTime = furthest;
                return;
              }
              if(delta > 0){ playedSeconds += delta; if(cur > furthest) furthest = cur; }
              lastTime = cur;
              if(requiredSeconds && !unlocked && playedSeconds >= requiredSeconds) unlock();
              else updateLabel();
            }, 500);
          } else {
            if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
            // Reaching the end only counts if the real required watch time
            // has actually been accumulated — otherwise someone could skip
            // to the last second and let it "end" to unlock early.
            if(e.data === YT.PlayerState.ENDED && (!requiredSeconds || playedSeconds >= requiredSeconds)) unlock();
          }
        }
      }
    });
    overlay._ytPlayer = player;
    overlay._ytStop = ()=>{
      if(pollTimer) clearInterval(pollTimer);
      try{ player.destroy(); }catch(err){}
    };
  });
}

function setupVideoGate(overlay, persona, contentId, c, btn){
  const video = document.getElementById("viewerVideo");
  const requiredSeconds = c.requiredMinutes ? Math.round(c.requiredMinutes*60) : null;
  const unlock = ()=>{
    btn.disabled = false;
    btn.textContent = "✅ Mark as completed";
    btn.onclick = ()=>{ markContentComplete(persona, contentId); overlay._doClose(); };
    const closeBtn = document.getElementById("closeViewer");
    if(closeBtn) closeBtn.style.display = "none"; // once Mark Complete is active, closing only happens via that button
  };

  let playedSeconds = 0, lastTime = 0, unlocked = false;
  let furthest = 0;       // furthest point reached through genuine, un-skipped forward playback
  let correcting = false; // guard so our own corrective currentTime jump doesn't re-trigger "seeking"
  const updateLabel = ()=>{ if(!unlocked) btn.textContent = requiredSeconds ? `⏳ Watched ${fmtTime(playedSeconds)} / ${fmtTime(requiredSeconds)}` : "⏳ Watch to the end…"; };
  updateLabel();

  video.addEventListener("play", ()=>{ lastTime = video.currentTime; });

  // Forwarding/skipping ahead is blocked outright — any jump past what's
  // actually been watched snaps straight back, whether it came from
  // dragging the scrubber, a keyboard seek, or double-tap-to-skip.
  video.addEventListener("seeking", ()=>{
    if(correcting) return;
    if(video.currentTime > furthest + 1){
      correcting = true;
      video.currentTime = furthest;
      showToast("Skipping ahead isn't allowed — please watch through.");
      setTimeout(()=>{ correcting = false; }, 50);
    }
    lastTime = video.currentTime;
  });

  video.addEventListener("timeupdate", ()=>{
    const cur = video.currentTime;
    // timeupdate only fires during playback, so pausing naturally stops
    // accumulation; the small delta cap stops anything that slips past the
    // seek-block above from being counted as watched time.
    if(!video.paused && !video.seeking){
      const delta = cur - lastTime;
      if(delta > 0 && delta < 1.5) playedSeconds += delta;
      if(cur > furthest) furthest = cur;
    }
    lastTime = cur;
    if(requiredSeconds && !unlocked && playedSeconds >= requiredSeconds){ unlocked = true; unlock(); }
    else updateLabel();
  });

  // Reaching the end only counts if the real required watch time has
  // actually been accumulated — without this check, someone could skip to
  // the last second and let it "end" to unlock early. For legacy content
  // with no required time set, reaching the end is still the bar.
  video.addEventListener("ended", ()=>{
    if(unlocked) return;
    if(!requiredSeconds || playedSeconds >= requiredSeconds){ unlocked = true; unlock(); }
  });
}

async function markContentComplete(persona, contentId){
  const uid = currentUid();
  try{
    const result = await api("/api/progress", {method:"POST", body: JSON.stringify({persona, uid, contentId})});
    if(state.multi){
      await loadMultiPersonaContent(state.roles);
    } else {
      currentProgress = result.completed;
      renderTopicGroups(persona);
    }
    if(document.getElementById("assignedSection")) loadAndRenderAssigned();
    showToast("Marked complete ✅");
  }catch(e){ showToast("Could not save progress."); }
}

async function renderAssessment(){
  const p = state.persona;
  const topic = state.topic || "General";
  crumbSub.textContent = `Assessment: ${p} — ${topic}`;
  app.innerHTML = `<div class="section-title">📝 ${p} — ${escapeHtml(topic)} Assessment</div><div id="assessBody">Loading…</div>`;
  const body = document.getElementById("assessBody");
  try{
    const aJson = await api("/api/assessment?persona="+encodeURIComponent(p)+"&topic="+encodeURIComponent(topic));
    const questions = aJson.questions || [];
    if(questions.length===0){ body.innerHTML = `<div class="empty">No assessment has been set up for ${escapeHtml(topic)} yet.</div>`; return; }
    const subJson = await api("/api/submission?persona="+encodeURIComponent(p)+"&topic="+encodeURIComponent(topic)+"&uid="+encodeURIComponent(currentUid()));
    if(subJson.exists){
      body.innerHTML = `<div class="msg msg-ok">✅ You already submitted this assessment on ${new Date(subJson.data.submittedAt).toLocaleString()}.${scoreLine(subJson.data.score)}</div>
      <button class="btn" id="resub">Submit again</button>`;
      document.getElementById("resub").onclick = ()=>drawForm(questions, body, p, topic, subJson.data.answers);
      return;
    }
    drawForm(questions, body, p, topic, {});
  }catch(e){ body.innerHTML = `<div class="empty">Could not load assessment.</div>`; }
}

// Free-text answers aren't auto-gradable, so the score only ever covers
// the multiple-choice questions — shown as "X/Y correct" once the server
// has graded the submission (it holds the correct answers, never the
// browser). No score line is shown if the topic has no MCQ questions.
function scoreLine(score){
  if(!score || !score.total) return "";
  return ` You scored <b>${score.correct}/${score.total}</b> on the multiple-choice questions.`;
}

function drawForm(questions, body, p, topic, prior){
  body.innerHTML = `<form id="assessForm"></form>`;
  const form = document.getElementById("assessForm");
  questions.forEach(q=>{
    const w = document.createElement("div");
    w.className="q-block";
    if(q.type==="mcq" && Array.isArray(q.options)){
      const priorVal = prior[q.id]||"";
      w.innerHTML = `<label>${escapeHtml(q.text)}</label>
      <div data-qid="${q.id}" data-qtype="mcq">
        ${q.options.map((opt,i)=>`
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);margin:4px 0">
            <input type="radio" name="mcq_${q.id}" value="${escapeAttr(opt)}" ${priorVal===opt?"checked":""}>
            ${escapeHtml(opt)}
          </label>`).join("")}
      </div>`;
    } else {
      w.innerHTML = `<label>${escapeHtml(q.text)}</label>
      <textarea class="field" rows="2" data-qid="${q.id}" data-qtype="text">${escapeHtml(prior[q.id]||"")}</textarea>`;
    }
    form.appendChild(w);
  });
  const submit = document.createElement("button");
  submit.type="button"; submit.className="btn btn-primary"; submit.textContent="Submit Assessment";
  submit.onclick = async ()=>{
    const answers = {};
    form.querySelectorAll("textarea[data-qid]").forEach(t=> answers[t.dataset.qid]=t.value);
    form.querySelectorAll("[data-qtype=mcq]").forEach(wrap=>{
      const checked = wrap.querySelector("input[type=radio]:checked");
      answers[wrap.dataset.qid] = checked ? checked.value : "";
    });
    try{
      const result = await api("/api/submission", {method:"POST", body: JSON.stringify({persona:p, topic, uid:currentUid(), answers})});
      if(result.passed === false){
        body.innerHTML = `<div class="msg msg-danger">❌ Assessment submitted.${scoreLine(result.score)} That's below the pass mark, so this topic's watch progress has been reset — you'll need to re-watch/re-read everything in <b>${escapeHtml(topic)}</b> before you can re-attempt.</div>
        <button class="btn btn-primary" id="backToContent">Back to content</button>`;
        document.getElementById("backToContent").onclick = ()=>{ state={view:"persona", persona:p, roles:state.roles, profile:state.profile, kiosk:state.kiosk}; render(); };
      } else if(result.passed === true){
        body.innerHTML = `<div class="msg msg-ok">✅ Passed!${scoreLine(result.score)}</div>`;
      } else {
        body.innerHTML = `<div class="msg msg-ok">✅ Assessment submitted. Thank you!${scoreLine(result.score)}</div>`;
      }
    }catch(e){ showToast("Could not submit."); }
  };
  form.appendChild(submit);
}

function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
